<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラウド単語帳</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #3b82f6;
      --text: #e0e0e0;
      --sub-text: #a0a0a0;
      --border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
    }

    .word-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .word-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-title {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .word-meaning {
      color: var(--sub-text);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .delete-btn {
      background: #ef4444;
      padding: 4px 10px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>単語帳 WebApp</h1>
      <button id="auth-btn">Googleでログイン</button>
    </header>

    <!-- 単語追加フォーム -->
    <div class="card">
      <div class="input-group">
        <input type="text" id="word-input" placeholder="単語 / 単語フレーズ (例: Apple)">
        <input type="text" id="meaning-input" placeholder="意味 / 訳 (例: りんご)">
        <button id="add-btn">追加する</button>
      </div>
    </div>

    <!-- 単語一覧表示 -->
    <ul class="word-list" id="word-list">
      <!-- JavaScriptで動的追加 -->
    </ul>
  </div>

  <!-- Firebase (v10 modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: ご自身の Firebase コンソールの設定値に置き換えてください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    const authBtn = document.getElementById("auth-btn");
    const addBtn = document.getElementById("add-btn");
    const wordInput = document.getElementById("word-input");
    const meaningInput = document.getElementById("meaning-input");
    const wordList = document.getElementById("word-list");

    // 認証状態の監視
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authBtn.textContent = "ログアウト";
        loadWords(user.uid);
      } else {
        authBtn.textContent = "Googleでログイン";
        wordList.innerHTML = '<li style="text-align:center; color: var(--sub-text);">ログインすると単語帳が表示されます</li>';
      }
    });

    // ログイン / ログアウト切り替え
    authBtn.addEventListener("click", () => {
      if (currentUser) {
        signOut(auth);
      } else {
        signInWithPopup(auth, provider).catch((err) => console.error(err));
      }
    });

    // 単語追加処理
    addBtn.addEventListener("click", async () => {
      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();

      if (!currentUser) {
        alert("ログインが必要です");
        return;
      }
      if (!word || !meaning) {
        alert("単語と意味の両方を入力してください");
        return;
      }

      await addDoc(collection(db, "users", currentUser.uid, "words"), {
        word: word,
        meaning: meaning,
        createdAt: serverTimestamp()
      });

      wordInput.value = "";
      meaningInput.value = "";
    });

    // リアルタイムデータの読み込み
    function loadWords(userId) {
      const q = query(collection(db, "users", userId, "words"));
      
      onSnapshot(q, (snapshot) => {
        wordList.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement("li");
          li.className = "word-item";
          li.innerHTML = `
            <div>
              <div class="word-title">${escapeHTML(data.word)}</div>
              <div class="word-meaning">${escapeHTML(data.meaning)}</div>
            </div>
            <button class="delete-btn" data-id="${docSnap.id}">削除</button>
          `;
          wordList.appendChild(li);
        });

        // 削除ボタンイベントバインド
        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const id = e.target.getAttribute("data-id");
            await deleteDoc(doc(db, "users", userId, "words", id));
          });
        });
      });
    }

    // HTMLエスケープ処理
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
