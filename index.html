
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text: #1c1c1e;
      --sub-text: #8e8e93;
      --accent: #007aff;
      --danger: #ff3b30;
      --border: #e5e5ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    header {
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Apple Glassmorphism Card Style */
    .card-stage {
      perspective: 1000px;
      width: 100%;
      height: 220px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #ffffff;
    }

    .card-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--sub-text);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .card-text {
      font-size: 24px;
      font-weight: 600;
      word-break: break-word;
    }

    /* Input Form */
    .form-group {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(120, 120, 128, 0.16);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    /* List Area */
    .list-title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 10px;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .word-item {
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
    }

    .word-item-text strong {
      display: block;
      font-size: 16px;
    }

    .word-item-text span {
      font-size: 13px;
      color: var(--sub-text);
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>単語帳</h1>
    <span id="card-count" style="color: var(--sub-text); font-weight: 600;">0 cards</span>
  </header>

  <div class="container">
    <!-- Card Display Section -->
    <div class="card-stage">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="card-label">Front</div>
          <div class="card-text" id="display-word">タップしてカードを追加</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Back</div>
          <div class="card-text" id="display-meaning">―</div>
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls">
      <button class="btn btn-secondary" onclick="prevCard()">◀ 前へ</button>
      <button class="btn btn-secondary" onclick="nextCard()">次へ ▶</button>
    </div>

    <!-- Input Form -->
    <div class="form-group">
      <input type="text" id="input-word" placeholder="単語 (例: Apple)" autocomplete="off">
      <input type="text" id="input-meaning" placeholder="意味 (例: りんご)" autocomplete="off">
      <button class="btn" onclick="addWord()">単語を追加する</button>
    </div>

    <!-- Registered List -->
    <div class="list-title">登録一覧</div>
    <div class="word-list" id="word-list"></div>
  </div>

  <script>
    let cards = JSON.parse(localStorage.getItem('my_flashcards')) || [
      { word: "Welcome", meaning: "ようこそ！カードをタップで裏返せます" }
    ];
    let currentIndex = 0;

    function save() {
      localStorage.setItem('my_flashcards', JSON.stringify(cards));
      updateUI();
    }

    function updateUI() {
      document.getElementById('card-count').innerText = `${cards.length} cards`;
      
      if (cards.length === 0) {
        document.getElementById('display-word').innerText = "カードがありません";
        document.getElementById('display-meaning').innerText = "下から追加してね";
      } else {
        if (currentIndex >= cards.length) currentIndex = 0;
        document.getElementById('display-word').innerText = cards[currentIndex].word;
        document.getElementById('display-meaning').innerText = cards[currentIndex].meaning;
      }

      // Render List
      const listEl = document.getElementById('word-list');
      listEl.innerHTML = '';
      cards.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="word-item-text">
            <strong>${escapeHtml(item.word)}</strong>
            <span>${escapeHtml(item.meaning)}</span>
          </div>
          <button class="btn-del" onclick="deleteWord(${index})">削除</button>
        `;
        listEl.appendChild(div);
      });
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard() {
      if (cards.length === 0) return;
      document.getElementById('card').classList.remove('flipped');
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % cards.length;
        updateUI();
      }, 150);
    }

    function prevCard() {
      if (cards.length === 0) return;
      document.getElementById('card').classList.remove('flipped');
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        updateUI();
      }, 150);
    }

    function addWord() {
      const wordInput = document.getElementById('input-word');
      const meaningInput = document.getElementById('input-meaning');
      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();

      if (!word || !meaning) return;

      cards.push({ word, meaning });
      wordInput.value = '';
      meaningInput.value = '';
      currentIndex = cards.length - 1;
      save();
    }

    function deleteWord(index) {
      cards.splice(index, 1);
      if (currentIndex >= cards.length) currentIndex = Math.max(0, cards.length - 1);
      save();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    // Initial Load
    updateUI();
  </script>
</body>
</html>
