<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Smart Vocab & Study Timer</title>
  <style>
    :root {
      --primary: #007AFF;
      --primary-dark: #0056b3;
      --break-color: #34C759;
      --bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --text: #1C1C1E;
      --text-sub: #8E8E93;
      --border: rgba(60, 60, 67, 0.12);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(242, 242, 247, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      text-align: center;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    main {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .section-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Timer */
    .timer-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: white;
      background: var(--primary);
      margin-bottom: 12px;
    }

    .timer-badge.break {
      background: var(--break-color);
    }

    .timer-display {
      font-size: 56px;
      font-weight: 800;
      font-family: monospace;
      text-align: center;
      margin: 10px 0 20px 0;
      letter-spacing: -1px;
    }

    .setting-row {
      display: flex;
      justify-content: space-around;
      background: #F8F8FA;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .setting-group label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .setting-group input {
      width: 70px;
      padding: 6px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 16px;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: #E5E5EA;
      color: var(--text);
    }

    /* Word List & Subject Select */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .subject-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 14px;
      text-align: left;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .subject-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .word-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-term {
      font-weight: 700;
      font-size: 16px;
    }

    .word-meaning {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }

    /* Chart Canvas */
    canvas {
      width: 100% !important;
      height: 180px !important;
    }

    /* Bottom Nav */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 70px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: 25%;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Smart Vocab & Timer</div>
  </header>

  <main>
    <!-- 教科選択 -->
    <section id="view-subjects" class="view-section active">
      <div class="section-title">教科選択</div>
      <div class="section-sub">学習する科目を選んでください</div>
      <div class="grid">
        <button class="subject-btn active" id="btn-eng" onclick="setSubject('english')">English</button>
        <button class="subject-btn" id="btn-jp" onclick="setSubject('japanese')">国語 (漢字)</button>
      </div>
    </section>

    <!-- 単語帳 -->
    <section id="view-words" class="view-section">
      <div class="section-title" id="words-title">English</div>
      <div class="section-sub">登録中の単語一覧</div>

      <div class="card">
        <input type="text" id="add-term" class="input-box" placeholder="単語・漢字">
        <input type="text" id="add-meaning" class="input-box" placeholder="意味・読み">
        <button class="btn btn-primary" style="width: 100%;" onclick="addWord()">追加する</button>
      </div>

      <div id="word-list"></div>
    </section>

    <!-- クイズ -->
    <section id="view-quiz" class="view-section">
      <div class="section-title">単語クイズ</div>
      <div class="section-sub">意味を入力して確認しましょう</div>

      <div class="card" style="text-align: center;">
        <div id="quiz-q" style="font-size: 28px; font-weight: 700; margin: 15px 0;">---</div>
        <input type="text" id="quiz-input" class="input-box" placeholder="回答を入力..." style="text-align: center;">
        <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="quiz-btn" onclick="checkAnswer()">判定</button>
        <div id="quiz-res" style="margin-top: 12px; font-weight: 700; min-height: 20px;"></div>
      </div>
    </section>

    <!-- 学習タイマー & 週間グラフ -->
    <section id="view-timer" class="view-section">
      <div class="section-title">学習タイマー</div>
      <div class="section-sub">ポモドーロタイマーと週間学習記録</div>

      <div class="card" style="text-align: center;">
        <div class="timer-badge" id="timer-badge">集中タイム</div>
        <div class="timer-display" id="timer-display">25:00</div>

        <div class="setting-row">
          <div class="setting-group">
            <label>勉強時間 (分)</label>
            <input type="number" id="study-min" value="25" min="1" max="120" onchange="resetTimer()">
          </div>
          <div class="setting-group">
            <label>休憩時間 (分)</label>
            <input type="number" id="break-min" value="5" min="1" max="60" onchange="resetTimer()">
          </div>
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="start-btn" onclick="toggleTimer()">スタート</button>
          <button class="btn btn-secondary" onclick="resetTimer()">リセット</button>
        </div>
      </div>

      <div class="card">
        <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">今週の学習時間 (分)</div>
        <canvas id="chartCanvas"></canvas>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active" id="nav-subjects" onclick="navTo('subjects')">
      <div class="nav-icon">📚</div>
      <span>教科</span>
    </div>
    <div class="nav-item" id="nav-words" onclick="navTo('words')">
      <div class="nav-icon">📝</div>
      <span>単語帳</span>
    </div>
    <div class="nav-item" id="nav-quiz" onclick="navTo('quiz')">
      <div class="nav-icon">✏️</div>
      <span>クイズ</span>
    </div>
    <div class="nav-item" id="nav-timer" onclick="navTo('timer')">
      <div class="nav-icon">⏱️</div>
      <span>タイマー</span>
    </div>
  </nav>

  <script>
    // Data Storage
    let currentSubject = 'english';
    let words = {
      english: [
        { id: 1, term: 'Apple', meaning: 'りんご' },
        { id: 2, term: 'Challenge', meaning: '挑戦' }
      ],
      japanese: [
        { id: 1, term: '恣意', meaning: 'しい' },
        { id: 2, term: '相殺', meaning: 'そうさい' }
      ]
    };

    // Load LocalStorage
    if (localStorage.getItem('app_words')) {
      try { words = JSON.parse(localStorage.getItem('app_words')); } catch(e){}
    }

    let weeklyData = [30, 45, 20, 50, 15, 60, 0]; // Mon-Sun
    if (localStorage.getItem('app_weekly')) {
      try { weeklyData = JSON.parse(localStorage.getItem('app_weekly')); } catch(e){}
    }

    // Navigation
    function navTo(target) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`view-${target}`).classList.add('active');
      document.getElementById(`nav-${target}`).classList.add('active');

      if (target === 'words') renderWords();
      if (target === 'quiz') startQuiz();
      if (target === 'timer') drawChart();
    }

    function setSubject(sub) {
      currentSubject = sub;
      document.getElementById('btn-eng').classList.toggle('active', sub === 'english');
      document.getElementById('btn-jp').classList.toggle('active', sub === 'japanese');
      document.getElementById('words-title').innerText = sub === 'english' ? 'English' : '国語 (漢字)';
      navTo('words');
    }

    // Word List Management
    function renderWords() {
      const container = document.getElementById('word-list');
      const list = words[currentSubject] || [];
      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin-top:20px;">単語がありません</div>';
        return;
      }
      container.innerHTML = list.map(w => `
        <div class="word-item">
          <div>
            <div class="word-term">${escapeHtml(w.term)}</div>
            <div class="word-meaning">${escapeHtml(w.meaning)}</div>
          </div>
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="deleteWord(${w.id})">削除</button>
        </div>
      `).join('');
    }

    function addWord() {
      const termEl = document.getElementById('add-term');
      const meaningEl = document.getElementById('add-meaning');
      if (!termEl.value.trim() || !meaningEl.value.trim()) return alert('両方入力してください');

      words[currentSubject].push({
        id: Date.now(),
        term: termEl.value.trim(),
        meaning: meaningEl.value.trim()
      });
      localStorage.setItem('app_words', JSON.stringify(words));
      termEl.value = '';
      meaningEl.value = '';
      renderWords();
    }

    function deleteWord(id) {
      words[currentSubject] = words[currentSubject].filter(w => w.id !== id);
      localStorage.setItem('app_words', JSON.stringify(words));
      renderWords();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Quiz
    let quizIdx = 0;
    let quizAnswered = false;

    function startQuiz() {
      const list = words[currentSubject] || [];
      const qEl = document.getElementById('quiz-q');
      const inputEl = document.getElementById('quiz-input');
      const resEl = document.getElementById('quiz-res');
      const btnEl = document.getElementById('quiz-btn');

      if (list.length === 0) {
        qEl.innerText = '単語が登録されていません';
        inputEl.style.display = 'none';
        btnEl.style.display = 'none';
        return;
      }

      inputEl.style.display = 'block';
      btnEl.style.display = 'block';
      quizAnswered = false;
      const current = list[quizIdx % list.length];
      qEl.innerText = current.term;
      inputEl.value = '';
      inputEl.disabled = false;
      resEl.innerText = '';
      btnEl.innerText = '判定';
    }

    function checkAnswer() {
      const list = words[currentSubject] || [];
      if (list.length === 0) return;

      if (quizAnswered) {
        quizIdx = (quizIdx + 1) % list.length;
        startQuiz();
        return;
      }

      const inputVal = document.getElementById('quiz-input').value.trim().toLowerCase();
      const current = list[quizIdx % list.length];
      const correctVal = current.meaning.trim().toLowerCase();
      const resEl = document.getElementById('quiz-res');

      if (inputVal && (inputVal === correctVal || correctVal.includes(inputVal))) {
        resEl.innerText = '⭕ 正解！';
        resEl.style.color = 'var(--break-color)';
      } else {
        resEl.innerText = `❌ 不正解... (正解: ${current.meaning})`;
        resEl.style.color = '#FF3B30';
      }

      quizAnswered = true;
      document.getElementById('quiz-input').disabled = true;
      document.getElementById('quiz-btn').innerText = '次の問題';
    }

    // Timer Logic
    let timerId = null;
    let isRunning = false;
    let isStudy = true;
    let timeLeft = 25 * 60;

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timer-display').innerText = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('start-btn');
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        btn.innerText = '再開';
      } else {
        isRunning = true;
        btn.innerText = '一時停止';
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerId);
            isRunning = false;
            btn.innerText = 'スタート';

            if (isStudy) {
              alert('集中タイム終了！休憩しましょう！');
              const dayIdx = (new Date().getDay() + 6) % 7; // Mon=0, Sun=6
              const mins = parseInt(document.getElementById('study-min').value) || 25;
              weeklyData[dayIdx] += mins;
              localStorage.setItem('app_weekly', JSON.stringify(weeklyData));
              drawChart();

              isStudy = false;
              document.getElementById('timer-badge').innerText = '休憩タイム';
              document.getElementById('timer-badge').classList.add('break');
              timeLeft = (parseInt(document.getElementById('break-min').value) || 5) * 60;
            } else {
              alert('休憩終了！学習を再開しましょう！');
              isStudy = true;
              document.getElementById('timer-badge').innerText = '集中タイム';
              document.getElementById('timer-badge').classList.remove('break');
              timeLeft = (parseInt(document.getElementById('study-min').value) || 25) * 60;
            }
            updateTimerDisplay();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      isStudy = true;
      document.getElementById('start-btn').innerText = 'スタート';
      document.getElementById('timer-badge').innerText = '集中タイム';
      document.getElementById('timer-badge').classList.remove('break');
      timeLeft = (parseInt(document.getElementById('study-min').value) || 25) * 60;
      updateTimerDisplay();
    }

    // Native Canvas Chart (No external Library Dependency)
    function drawChart() {
      const canvas = document.getElementById('chartCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);

      const labels = ['月', '火', '水', '木', '金', '土', '日'];
      const maxVal = Math.max(...weeklyData, 60);
      const paddingBottom = 24;
      const paddingTop = 20;
      const chartHeight = height - paddingBottom - paddingTop;
      const barWidth = 24;
      const step = width / labels.length;

      labels.forEach((label, i) => {
        const x = i * step + step / 2;
        const val = weeklyData[i];
        const barH = (val / maxVal) * chartHeight;
        const y = height - paddingBottom - barH;

        // Bar
        ctx.fillStyle = '#007AFF';
        ctx.beginPath();
        if (barH > 0) {
          ctx.roundRect(x - barWidth / 2, y, barWidth, barH, [4, 4, 0, 0]);
        }
        ctx.fill();

        // Label (Day)
        ctx.fillStyle = '#8E8E93';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, height - 6);

        // Value Label
        if (val > 0) {
          ctx.fillStyle = '#1C1C1E';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText(`${val}分`, x, y - 4);
        }
      });
    }

    // Init
    window.addEventListener('resize', drawChart);
    resetTimer();
  </script>
</body>
</html>
